name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore LightSwitchesChinese.csproj

      - name: Build
        run: dotnet build LightSwitchesChinese.csproj --configuration Release --no-restore

      - name: Prepare package
        run: |
          mkdir -p package/LightSwitchesChinese
          cp manifest.json package/LightSwitchesChinese/
          cp bin/Release/net9.0/LightSwitchesChinese.dll package/LightSwitchesChinese/
          cd package
          zip -r LightSwitchesChinese.zip LightSwitchesChinese

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightSwitchesChinese
          path: package/LightSwitchesChinese.zip
